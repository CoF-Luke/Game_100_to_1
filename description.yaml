game_100_to_1:

  mero_name:
    Игра 100 к 1

  description:
    100 к 1 - это популярная российская телеигра по типу Family Feud. 
    Две команды угадывают самые распространённые ответы на необычные вопросы, которые раньше задавали прохожим.

  properties:
    - ~50 человек (до 70 регистраций)
    - По 5-6 человек в команде, примерное одинаковое количество координаторов и старост в команде
    - ~1.5 часа

  plan_of_game:

    Общий раунд:
      properties:
        - 40 минут
        - Играют все команды на местах за столами.
        - Внутри этого раунда — мини раунды (ниже).
      description:
        Командам выдаются бланки на каждый мини раунд, где они отвечают на заданный вопрос (вопросы).
        Ведущий озвучивает вопрос, командам даётся время на подумать и написать ответы, 
        после каждого мини раунда собираются бланки, ведущий озвучивает ответы.
      Примечание:
        Ответы команд проверяются на смысловое совпадение, а не дословное, с ответами из опроса.
      Мини раунды:
        - Одиночная игра:
          - 1 бланк, 2 вопроса
          - На каждый вопрос команде предлагается дать (написать в бланке) 6 ответов.
            Проверяется каждый из этих ответов. 
            Если ответ присутсвует в топ-6 ответов на этот вопрос в опросе (Далее топ-* в опросе),
            то за этот ответ команда получает столько очков, сколько человек ответило также в опросе.
          - 2 минуты на каждый вопрос
        - Двойная игра:
          - Правила те же, что и в Одиночной игре, 
            за исключением того, что команды по итогам этого раунда получают двойные баллы.
        - Продолжи фразу
        - Кто это сказал?
        - Блиц
        - Запрещённый ответ:
          - 1 бланк, 2 вопроса
          - Из полученных из опроса ответов выбирается один из первых пяти популярных, он отмечается как 
          - Нужно дать 2 ответа на вопрос => шанс наткнуться на запрещённый ответ ~0,3 => если один из двух ответов 
            команды является запрещённым, то за этот вопрос команда получает -25 баллов; 
            за каждый же правильный ответ (который входит в пятёрку популярных ответов) команда получает +25 баллов.
      Фичи для каждой команды на игру:
          - Удвоение баллов за раунд (как в +, так и в -)


    Полуфинал:
      properties:
        - 15 минут
        - Играют 2 команды, набравшие наибольшее количество очков по итогам общего раунда. 
          Эти команды выходят за стойки (столы около сцены)
        - 1-2 мини раунда
      description:
        Этот раунд проводится в таком же виде, как в оригинальной игре
      Мини раунды:
        - Тройная игра:
          - Правила те же, что и в Одиночной игре, 
            за исключением того, что команды по итогам этого раунда получают тройные баллы.
        - Игра наоборот:
          - 


    Финал:
      properties:
        - 10 минут
        - Играют 2 человека (староста и координатор) из победившей в полуфинале команды.
      description:
        Сначала один из них выходит из аудитории в наушниках, чтобы он не видел и не слышал, что будет происходить в аудитории.
        У второго участника будет 30 секунд





  Подготовка к меро:
    - Опросить студентов Бауманки (которые точно не придут на мероприятие (не координаторы и не старосты)) по вопросам, 
      которые будут использоваться в игре.
    - Составить список вопросов, преобразовать их в гугл форму
    - Возможные варианты опроса:
      - Опрашивать студентов в коридорах Бауманки (приоритетно)
      - Рассылать опрос среди знакомы (не старост и не координаторов)



