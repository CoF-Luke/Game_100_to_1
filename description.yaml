game_100_to_1:

  mero_name:
    Игра 100 к 1

  description:
    Это интересная "научно-популярная игра"...

  properties:
    - ~50 человек (до 70 регистраций)
    - По 5-6 человек в команде, примерное одинаковое количество координаторов и старост в команде
    - ~1.5 часа

  plan_of_game:

    Общий раунд:
      properties:
        - 40 минут
        - Играют все команды на местах за столами.
        - Внутри этого раунда — мини раунды (ниже).
      description:
        Командам выдаются бланки на каждый мини раунд, где они отвечают на заданных вопрос (вопросы).
        Ведущий озвучивает вопрос, командам даётся время на подумать и написать ответы, после каждого мини раунда собираются бланки, ведущий озвучивает ответы.
      Мини раунды:
        - Одиночная игра
        - Двойная игра
        - Продолжи фразу
        - Кто это сказал?
        - Блиц
        - Запрещённый ответ:
          - 1 бланк, 2 вопроса
          - Из полученных из опроса ответов выбирается один из первых пяти популярных, он отмечается как 
          - Нужно дать 2 ответа на вопрос => шанс наткнуться на запрещённый ответ ~0,3 => если один из двух ответов команды является запрещённым, то за этот вопрос команда получает -25 баллов; за каждый же правильный ответ (который входит в пятёрку популярных ответов) команда получает +25 баллов.
      Фичи для каждой команды на игру:
          - Удвоение баллов за раунд (как в +, так и в -)


    Полуфинал:
      properties:
        - 15 минут
        - Играют 2 команды, набравшие наибольшее количество очков по итогам общего раунда. Эти команды выходят за стойки (столы около сцены)
        - 1-2 мини раунда
      description:
        Этот раунд проводится в таком же виде, как в оригинальной игре
      Мини раунды:
        - Тройная игра
        - Игра наоборот
    Финал:
      properties:
        - 10 минут
        - Играют 2 человека (староста и координатор) из победившей в полуфинале команды.
      description:
        Сначала один из них выходит из аудитории в наушниках, чтобы он не видел и не слышал, что будет происходить в аудитории.
        У второго участника будет 30 секунд

  Мини раунды:



  Подготовка к меро:
  Опросить студентов Бауманки (которые точно не придут на мероприятие (не координаторы и не старосты)) по вопросам, которые будут использоваться в игре.
  Составить список вопросов, преобразовать их в гугл форму
